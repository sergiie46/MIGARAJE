name: Build Mi Garaje Android

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_release:
        description: "Compilar también APK + AAB Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.13"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:

  # ============================================================
  # DEBUG
  # ============================================================

  debug:
    name: Tests + Lint + APK Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # JAVA 17
      # --------------------------------------------------------

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # --------------------------------------------------------
      # CACHE GRADLE
      # --------------------------------------------------------

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-


      # --------------------------------------------------------
      # ANDROID SDK 36
      # --------------------------------------------------------

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"


      # --------------------------------------------------------
      # LOCAL.PROPERTIES
      # --------------------------------------------------------

      - name: Crear local.properties
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          echo "Contenido de local.properties:"
          cat local.properties


      # --------------------------------------------------------
      # GOOGLE SERVICES OPCIONAL
      # --------------------------------------------------------

      - name: Restaurar google-services.json
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

          echo "google-services.json restaurado."


      # --------------------------------------------------------
      # GRADLE 8.13
      # NO USAMOS EL WRAPPER DEL PROYECTO
      # --------------------------------------------------------

      - name: Instalar Gradle 8.13
        shell: bash
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"


      - name: Comprobar versiones
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version || true


      # --------------------------------------------------------
      # LIMPIEZA
      # --------------------------------------------------------

      - name: Limpiar proyecto
        shell: bash
        run: |
          gradle clean \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------------
      # TESTS
      # --------------------------------------------------------

      - name: Tests unitarios
        shell: bash
        run: |
          gradle testDebugUnitTest \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------------
      # LINT
      #
      # IMPORTANTE:
      # aunque falle Lint, imprimimos EL INFORME ENTERO.
      # Así veremos todos los errores y no solamente el primero.
      # --------------------------------------------------------

      - name: Android Lint completo
        shell: bash
        run: |
          set +e

          gradle lintDebug \
            --stacktrace \
            --no-daemon

          LINT_EXIT=$?

          echo ""
          echo "============================================================"
          echo "             INFORME COMPLETO ANDROID LINT"
          echo "============================================================"
          echo ""

          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "No se encontró:"
            echo "$REPORT"
            echo ""
            echo "Buscando otros informes Lint..."
            find app/build \
              \( -iname "*lint*.txt" -o -iname "*lint*.html" -o -iname "*lint*.xml" \) \
              -type f \
              -print || true
          fi

          echo ""
          echo "============================================================"
          echo "                 FIN DEL INFORME LINT"
          echo "============================================================"
          echo ""

          exit $LINT_EXIT


      # --------------------------------------------------------
      # COMPILAR APK DEBUG
      # --------------------------------------------------------

      - name: Compilar APK Debug
        shell: bash
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------------
      # COMPROBAR APK
      # --------------------------------------------------------

      - name: Buscar APK generado
        shell: bash
        run: |
          echo "APK encontrados:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -f app/build/outputs/apk/debug/app-debug.apk


      # --------------------------------------------------------
      # SUBIR APK
      # --------------------------------------------------------

      - name: Subir Mi Garaje Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiGaraje-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      # --------------------------------------------------------
      # SUBIR INFORMES LINT
      # --------------------------------------------------------

      - name: Subir informes Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiGaraje-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14



  # ============================================================
  # RELEASE APK + AAB
  #
  # SOLO SE EJECUTA MANUALMENTE CUANDO:
  #
  # Actions
  # → Build Mi Garaje Android
  # → Run workflow
  # → build_release = true
  #
  # ============================================================

  release:
    name: APK + AAB Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Descargar proyecto
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # JAVA
      # --------------------------------------------------------

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # --------------------------------------------------------
      # CACHE
      # --------------------------------------------------------

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/settings.gradle*') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-


      # --------------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------------

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"


      # --------------------------------------------------------
      # LOCAL.PROPERTIES
      # --------------------------------------------------------

      - name: Crear local.properties
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties


      # --------------------------------------------------------
      # COMPROBAR SECRETS
      # --------------------------------------------------------

      - name: Comprobar configuración Release
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEVELOPER_CONTACT: ${{ secrets.DEVELOPER_CONTACT }}
        run: |
          FAILED=0

          check_secret() {
            NAME="$1"
            VALUE="$2"

            if [ -z "$VALUE" ]; then
              echo "::error::Falta el secret $NAME"
              FAILED=1
            else
              echo "$NAME configurado."
            fi
          }

          check_secret "GOOGLE_SERVICES_JSON_B64" "$GOOGLE_SERVICES_JSON_B64"
          check_secret "RELEASE_KEYSTORE_B64" "$RELEASE_KEYSTORE_B64"
          check_secret "RELEASE_STORE_PASSWORD" "$RELEASE_STORE_PASSWORD"
          check_secret "RELEASE_KEY_ALIAS" "$RELEASE_KEY_ALIAS"
          check_secret "RELEASE_KEY_PASSWORD" "$RELEASE_KEY_PASSWORD"
          check_secret "DEVELOPER_CONTACT" "$DEVELOPER_CONTACT"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi


      # --------------------------------------------------------
      # FIREBASE
      # --------------------------------------------------------

      - name: Restaurar google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

          test -s app/google-services.json


      # --------------------------------------------------------
      # KEYSTORE
      # --------------------------------------------------------

      - name: Restaurar keystore Release
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore

          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > keystore/migaraje-release.jks

          test -s keystore/migaraje-release.jks


      # --------------------------------------------------------
      # KEYSTORE.PROPERTIES
      # --------------------------------------------------------

      - name: Crear keystore.properties
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore/migaraje-release.jks
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF


      # --------------------------------------------------------
      # DEVELOPER CONTACT
      #
      # NO INVENTAMOS NINGÚN EMAIL.
      # SALE DEL SECRET DE GITHUB.
      # --------------------------------------------------------

      - name: Añadir configuración Release
        shell: bash
        env:
          DEVELOPER_CONTACT: ${{ secrets.DEVELOPER_CONTACT }}
          FIREBASE_STORAGE_ENABLED: ${{ secrets.FIREBASE_STORAGE_ENABLED }}
        run: |
          {
            echo ""
            echo "DEVELOPER_CONTACT=${DEVELOPER_CONTACT}"

            if [ -n "$FIREBASE_STORAGE_ENABLED" ]; then
              echo "FIREBASE_STORAGE_ENABLED=${FIREBASE_STORAGE_ENABLED}"
            fi
          } >> local.properties


      # --------------------------------------------------------
      # GRADLE
      # --------------------------------------------------------

      - name: Instalar Gradle 8.13
        shell: bash
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"


      - name: Comprobar versiones
        shell: bash
        run: |
          java -version
          gradle --version


      # --------------------------------------------------------
      # TESTS RELEASE
      # --------------------------------------------------------

      - name: Limpiar
        shell: bash
        run: |
          gradle clean \
            --stacktrace \
            --no-daemon


      - name: Tests
        shell: bash
        run: |
          gradle testDebugUnitTest \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------------
      # LINT RELEASE/DEBUG
      # --------------------------------------------------------

      - name: Android Lint
        shell: bash
        run: |
          set +e

          gradle lintDebug \
            --stacktrace \
            --no-daemon

          LINT_EXIT=$?

          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          echo ""
          echo "============================================================"
          echo "             INFORME COMPLETO ANDROID LINT"
          echo "============================================================"
          echo ""

          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          fi

          exit $LINT_EXIT


      # --------------------------------------------------------
      # BUILD RELEASE
      # --------------------------------------------------------

      - name: Compilar APK y AAB Release
        shell: bash
        run: |
          gradle \
            assembleRelease \
            bundleRelease \
            --stacktrace \
            --no-daemon


      # --------------------------------------------------------
      # COMPROBAR RESULTADOS
      # --------------------------------------------------------

      - name: Comprobar APK y AAB
        shell: bash
        run: |
          echo ""
          echo "APK:"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print || true

          echo ""
          echo "AAB:"
          find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print || true

          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab


      # --------------------------------------------------------
      # APK RELEASE
      # --------------------------------------------------------

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: MiGaraje-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------------
      # AAB PLAY STORE
      # --------------------------------------------------------

      - name: Subir AAB Play Store
        uses: actions/upload-artifact@v4
        with:
          name: MiGaraje-PlayStore-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------------
      # INFORMES LINT
      # --------------------------------------------------------

      - name: Subir informes Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiGaraje-release-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 30
